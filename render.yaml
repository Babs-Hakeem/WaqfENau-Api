services:
  - type: web
    name: waqfenau-api
    env: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    autoDeploy: true
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: ASPNETCORE_URLS
        value: http://+:80
      - key: Jwt__Issuer
        value: WaqfENauApi
      - key: Jwt__Audience
        value: WaqfENauClient
      - key: Email__From
        value: noreply@waqfenau.org
      - key: Email__SmtpHost
        value: smtp.gmail.com
      - key: Email__SmtpPort
        value: "587"
      - key: Email__Username
        value: babshakeem786@gmail.com
      - key: ConnectionStrings__DefaultConnection
        sync: false
      - key: Jwt__Key
        sync: false
      - key: Email__Password
        sync: false
